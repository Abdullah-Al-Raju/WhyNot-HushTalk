[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whynot-hushtalk"
version = "2.1.0"
description = "Hide secret messages inside network ping delays (ICMP timing-channel covert messaging)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Al Raju" }
]
keywords = [
    "icmp",
    "covert-channel",
    "timing-channel",
    "steganography",
    "network-security",
    "exfiltration",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "scapy>=2.5.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
hushtalk = "hushtalk:main"
whisper = "whisper:main"
listen = "listen:main"

[project.urls]
Homepage = "https://github.com/Abdullah-Al-Raju/WhyNot-HushTalk"
Repository = "https://github.com/Abdullah-Al-Raju/WhyNot-HushTalk"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
