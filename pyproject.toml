[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whynot-hushtalk"
version = "2.2.0"
description = "Network ping timing-channel covert communication suite and detection testing framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abduallah Al Raju" }
]
keywords = [
    "covert-channel",
    "timing-channel",
    "icmp-covert-channel",
    "steganography",
    "network-steganography",
    "exfiltration",
    "data-exfiltration",
    "packet-timing",
    "network-security",
    "detection-engineering",
    "soc-analyst",
    "cybersecurity",
    "traffic-analysis",
    "side-channel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "colorama>=0.4.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[project.scripts]
hushtalk = "hushtalk:main"
whisper = "whisper:main"
listen = "listen:main"

[project.urls]
Homepage = "https://github.com/Abdullah-Al-Raju/WhyNot-HushTalk"
Repository = "https://github.com/Abdullah-Al-Raju/WhyNot-HushTalk"
Documentation = "https://github.com/Abdullah-Al-Raju/WhyNot-HushTalk#readme"
Issues = "https://github.com/Abdullah-Al-Raju/WhyNot-HushTalk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
